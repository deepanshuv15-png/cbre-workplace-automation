<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login - Workplace Helpdesk (Demo)</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header><h1>Workplace Helpdesk (Demo)</h1></header>
  <main style="max-width: 400px">
    <h2>Sign in</h2>
    <div id="error" class="alert error hidden" role="alert">Invalid username or password</div>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
    <p style="font-size: 12px; color: #666">Demo users: facilities.user / viewer.user (password: Password123)</p>
  </main>
  <script>
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('error').classList.remove('hidden');
    }
  </script>
</body>
</html>
